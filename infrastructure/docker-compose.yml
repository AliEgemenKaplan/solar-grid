services:
  # ─── Infrastructure ────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: solar-grid-rabbitmq
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres-smart-meter:
    image: postgres:15-alpine
    container_name: solar-grid-postgres-smart-meter
    environment:
      POSTGRES_DB: smart_meter_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - smart_meter_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d smart_meter_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-pricing:
    image: postgres:15-alpine
    container_name: solar-grid-postgres-pricing
    environment:
      POSTGRES_DB: pricing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pricing_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pricing_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-matching:
    image: postgres:15-alpine
    container_name: solar-grid-postgres-matching
    environment:
      POSTGRES_DB: matching_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - matching_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d matching_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-ledger:
    image: postgres:15-alpine
    container_name: solar-grid-postgres-ledger
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ledger_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Application Services ──────────────────────────────────────────────────
  smart-meter-service:
    build:
      context: ..
      dockerfile: apps/smart-meter-service/Dockerfile
    container_name: solar-grid-smart-meter
    ports:
      - '127.0.0.1:${SMART_METER_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres-smart-meter:5432/smart_meter_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres-smart-meter:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  pricing-engine-service:
    build:
      context: ..
      dockerfile: apps/pricing-engine-service/Dockerfile
    container_name: solar-grid-pricing-engine
    ports:
      - '127.0.0.1:${PRICING_PORT:-3002}:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres-pricing:5432/pricing_db
    depends_on:
      postgres-pricing:
        condition: service_healthy
    restart: unless-stopped

  billing-ledger-service:
    build:
      context: ..
      dockerfile: apps/billing-ledger-service/Dockerfile
    container_name: solar-grid-billing-ledger
    ports:
      - '127.0.0.1:${BILLING_PORT:-3004}:3004'
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://postgres:postgres@postgres-ledger:5432/ledger_db
    depends_on:
      postgres-ledger:
        condition: service_healthy
    restart: unless-stopped

  trade-matching-service:
    build:
      context: ..
      dockerfile: apps/trade-matching-service/Dockerfile
    container_name: solar-grid-trade-matching
    ports:
      - '127.0.0.1:${TRADE_MATCHING_PORT:-3003}:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://postgres:postgres@postgres-matching:5432/matching_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PRICING_ENGINE_URL: http://pricing-engine-service:3002
      BILLING_LEDGER_URL: http://billing-ledger-service:3004
    depends_on:
      postgres-matching:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pricing-engine-service:
        condition: service_started
      billing-ledger-service:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq_data:
  smart_meter_data:
  pricing_data:
  matching_data:
  ledger_data:
