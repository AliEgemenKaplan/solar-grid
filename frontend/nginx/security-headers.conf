# Included in every location that serves the app: nginx drops server-level
# add_header directives in any location that sets one of its own.
#
# The content security policy that limits scripts and connections is written
# into index.html at build time, from the same API addresses the app uses.
# This header adds the directives a meta tag cannot carry.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
