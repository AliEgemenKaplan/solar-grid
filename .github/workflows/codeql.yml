# CodeQL static analysis, GitHub's own scanner.
#
# The whole repository is TypeScript - four NestJS services, three shared
# packages and a React dashboard - so one `javascript-typescript` analysis
# covers all of it. Nothing is compiled for the scan: CodeQL reads the sources
# directly, which is why there is no build step here.
#
# Results appear under the repository's Security tab, not as build output.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Queries improve without the code changing. Mondays, 05:41 UTC.
    - cron: '41 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Writing the findings to the Security tab.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds the lower-severity security queries to the
          # default set. Quality queries are left out: they report style, which
          # eslint already covers here.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
