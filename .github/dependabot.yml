# Dependency updates, opened as pull requests so CI decides whether they pass.
#
# Two ecosystems: the pnpm workspace, and the actions the workflows pin.
# Updates are grouped so a week's patches arrive as one reviewable pull request
# rather than a dozen.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates rarely need separate review.
      routine:
        update-types: [minor, patch]
    # Majors still arrive as their own pull request, because they are the ones
    # that break a build.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
